<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <rect width="100%" height="100%" fill="#f8f6f2" filter="url(#grain)" opacity="0.6"/>
  <!-- Subtle horizontal lines for paper fibre texture -->
  <line x1="0" y1="10" x2="200" y2="10" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="20" x2="200" y2="20" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="30" x2="200" y2="30" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="40" x2="200" y2="40" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="50" x2="200" y2="50" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="60" x2="200" y2="60" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="70" x2="200" y2="70" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="80" x2="200" y2="80" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="90" x2="200" y2="90" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="100" x2="200" y2="100" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="110" x2="200" y2="110" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="120" x2="200" y2="120" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="130" x2="200" y2="130" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="140" x2="200" y2="140" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="#e8e4dc" stroke-width="0.3" opacity="0.5"/>
  <line x1="0" y1="160" x2="200" y2="160" stroke="#e8e4dc" stroke-width="0.3" opacity="0.4"/>
